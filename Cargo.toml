[package]
name = "actor-lite"
version = "0.0.2"
edition = "2024"
description = "基于 tokio 的轻量 actor 抽象，提供命令通道、状态/进度广播和事件通知"
license = "MIT"
readme = "README.md"
repository = "https://github.com/KOPZWMZ/actor_kit.git"
[dependencies]
# 默认关掉全部 feature，只留 sync（纯数据结构，不需要 runtime）
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
tracing = "0.1"

[features]
default = ["async", "manager"]
async = ["tokio/rt", "tokio/time", "tokio/macros"] # tokio::spawn + 监听器
manager = ["async"]                                # manager 依赖 time + spawn

[dev-dependencies]
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
] }
